services:
  - type: web
    name: spa-cms-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @spa/shared build && pnpm --filter api exec prisma generate && pnpm --filter api build
    preDeployCommand: pnpm --filter api exec prisma migrate deploy
    startCommand: pnpm --filter api start:prod
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - packages/tsconfig/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: spa-cms-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: spa-cms-db
    region: singapore
    plan: basic-256mb
    databaseName: spa_cms
    user: spa_cms
